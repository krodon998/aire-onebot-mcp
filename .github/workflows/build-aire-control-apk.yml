name: Build Aire Control APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/AireControl/**"
      - ".github/workflows/build-aire-control-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aire-control-debug-keystore-v1

      - name: Build debug APK
        working-directory: android/AireControl
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AireControl-debug
          path: android/AireControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/AireControl/app/build/outputs/apk/debug/app-debug.apk AireControl-latest.apk
          if gh release view aire-control-latest >/dev/null 2>&1; then
            gh release upload aire-control-latest AireControl-latest.apk --clobber
          else
            gh release create aire-control-latest AireControl-latest.apk \
              --title "Aire Control latest" \
              --notes "Rolling debug build of Aire Control." \
              --prerelease
          fi
