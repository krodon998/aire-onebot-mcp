name: Build Aire Control APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/AireControl/**"
      - ".github/workflows/build-aire-control-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        id: sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: "${{ steps.sdk.outputs.sdkmanager }}" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android/AireControl
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AireControl-debug
          path: android/AireControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
