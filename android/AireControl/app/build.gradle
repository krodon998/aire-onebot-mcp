plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aire.control'
    compileSdk 35

    defaultConfig {
        applicationId "com.aire.control"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
